function overview(){return `<section class="pad"><div class="head"><h1>Agora</h1><div class="seg"><button class="${state.live?'selected':''}" onclick="state.live=true;render()">Ao vivo</button><button class="${!state.live?'selected':''}" onclick="state.live=false;render()">Histórico</button></div></div><div class="two">${liveCard('Atlas','Empresas de logística',0)}${liveCard('Radar','Preços de monitores',1)}</div><div class="row spread spaced"><h2>Seus agentes</h2><button class="small muted" onclick="go('agents')">Ver todos</button></div><div class="three">${names.slice(0,3).map((n,i)=>`<button class="panel agent-mini" onclick="openAgent('${n}')">${avatar(n,36)}<span>${n}<small>${[12,8,5][i]} pesquisas · ${[3,2,1][i]} boxes</small></span></button>`).join('')}</div><div class="spaced"><h2>Recentes</h2></div><div class="list-row">${avatar('Lumen',27)}Relatório de mercado<span class="right">Concluído · 16:42</span></div><div class="list-row">${avatar('Atlas',27)}Fornecedores do Sudeste<span class="right">86 registros · Ontem</span></div></section>`}
function workspace(){const shell=state.tab==='Shell';return `<section class="terminal-page"><div class="terminal-tabs"><button class="${!shell?'active':''}" onclick="state.tab='Agente';render()">${brand(state.provider,18)} ${state.agent} · ${state.provider}${state.waiting?'<span class="dot amber ping"></span>':''} <span class="faint">×</span></button><button class="${shell?'active':''}" onclick="state.tab='Shell';render()">⌁ zsh <span class="faint">×</span></button><button aria-label="Nova aba" onclick="openSession()">＋</button></div><div class="toolbar">${shell?'<span class="muted">zsh · Shell local</span><button onclick="openSession()">Iniciar agente</button>':`<span class="brand-select">${brand(state.provider,18)}<select aria-label="CLI" onchange="switchCLI(this.value)">${['Claude Code','Codex','OpenCode','Outro CLI'].map(x=>`<option ${state.provider===x?'selected':''}>${x}</option>`).join('')}</select></span><select aria-label="Modelo" onchange="state.model=this.value;toast('Seleção de modelo simulada.');render()">${['Padrão',...(state.provider==='Codex'?['GPT · rápido','GPT · avançado']:['Sonnet','Opus'])].map(x=>`<option ${state.model===x?'selected':''}>${x}</option>`).join('')}</select><button onclick="openAgent(state.agent)">${state.agent} ↗</button><button onclick="openSkills()">${state.skills.length} skills ⌄</button>`}<span class="space"></span><span class="faint small">${state.location==='Worktree'?'Worktree':state.location==='Avulso'?'Avulso':'Sem worktree'}</span><span class="muted small">${state.attached?'Box B2B':'Sem desktop'}</span></div><div class="split" style="${state.attached?'':'grid-template-columns:1fr'}"><div class="terminal">${shell?`<div class="cli-title">zsh</div><div class="path">${state.location==='Avulso'?'~':state.location==='Worktree'?'~/Pesquisas/worktrees/logistica':'~/Pesquisas/logistica'}</div><pre>$ ▌</pre>`:`<div class="cli-title">${brand(state.provider,26)} ${state.provider}</div><div class="path">${state.model} · ~/Pesquisas/logistica</div><pre style="color:#dedee4">❯ Encontre 50 empresas de logística no Brasil.\n  Salve nome, site, região e fonte.</pre><pre>● 32 empresas validadas.\n\n  ✓ fontes consultadas\n  ✓ empresas.csv atualizado\n  ✓ contexto salvo</pre>${state.waiting||state.human?`<pre class="request">! Ação necessária\n\n<span class="muted">${state.human?'  Você está no controle. Vou aguardar.':'  O site pediu uma verificação.\n  Assuma a tela para continuar.'}</span></pre>`:'<pre>● Conferindo a página.\n  Continuando do registro 33…</pre>'}`}${state.message?'<pre id="message"></pre>':''}<form onsubmit="event.preventDefault();state.message=this.elements.message.value;render();document.querySelector('#message').textContent='❯ '+state.message"><span>❯</span><input name="message" aria-label="Terminal não conectado" placeholder="Escreva no terminal…" autocomplete="off"></form><div class="foot"><span>Terminal não conectado</span><span></span></div></div><div class="desktop" style="${state.attached?'':'display:none'}"><div class="desktop-title"><b>Desktop</b><div class="row"><span class="dot"></span>Ao vivo<button aria-label="Ampliar desktop" onclick="showDesktop()">⤢</button></div></div>${state.waiting||state.human?`<div class="attention"><span>${state.human?'↖ Você no controle':'♧ Ação necessária'}</span><button onclick="takeControl()">${state.human?'Devolver':'Assumir'}</button></div>`:''}<div class="bigstream">${stream(state.agent==='Radar'?1:0)}${state.waiting||state.human?`<div class="verify"><div class="verify-box"><div class="symbol">◎</div><p>Verificação do site</p><small>${state.human?'Faça a verificação e devolva o controle.':'Aguardando sua intervenção.'}</small><small>Representação ilustrativa</small></div></div>`:''}</div><div class="desktop-bottom"><span>Box B2B</span><button onclick="takeControl()">${state.human?'Devolver ao agente':'Assumir controle'}</button></div></div></div></section>`}
function switchCLI(next){if(next===state.provider)return;if(next==='Outro CLI'){toast('Clientes adicionais: executável e argumentos configuráveis no produto.');render();return}document.querySelector('#modal').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="Trocar CLI"><div class="head"><h2 class="row">${brand(next,28)}Trocar para ${next}</h2><button onclick="closeModal();render()">×</button></div><p class="muted">A mesma box, os arquivos e o checkpoint da tarefa.</p><p class="faint small" style="margin-top:14px">O cliente de destino abre sua própria sessão. Conversas internas não são transferíveis.</p><div class="dialog-footer"><button class="button" onclick="closeModal();render()">Cancelar</button><button class="button primary" onclick="state.provider='${next}';state.model='Padrão';closeModal();render();toast('A transferência entre CLIs ainda não está implementada.')">Salvar contexto e trocar</button></div></div></div>`}
function takeControl(){if(state.human){state.human=false;state.waiting=false}else{state.human=true;state.waiting=false}render()}
function agents(){return `<section class="pad"><div class="head"><h1>Agentes</h1><div class="row"><button class="button" onclick="toast('Importação prevista: selecionar definições locais, preservando os originais.')">↓ Importar</button><button class="button primary" onclick="openSession()">＋ Novo agente</button></div></div><div class="three">${names.map((n,i)=>`<button class="panel agent-card" onclick="openAgent('${n}')">${avatar(n,43)}<h2>${n}</h2><p>${roles[i]}</p><div class="meta"><span>${[12,8,5,3,7,4][i]} pesquisas</span><span>${[3,2,1,2,3,1][i]} boxes</span></div><div class="meta"><span>▧ ${[24,12,8,6,15,7][i]} memórias</span><span>${i<2?'Em uso':'Disponível'}</span></div></button>`).join('')}</div></section>`}
function openAgent(n){state.agent=n;state.detail='Memória';go('detail')}
function detail(){return `<section class="pad"><div class="head"><div class="row"><button aria-label="Voltar para agentes" onclick="go('agents')">‹</button>${avatar(state.agent,42)}<h1>${state.agent}</h1></div><button class="button primary" onclick="openSession()">▷ Usar agente</button></div><div class="tabs">${['Memória','Histórico','Boxes','Skills'].map(x=>`<button class="${state.detail===x?'active':''}" onclick="state.detail='${x}';render()">${x}</button>`).join('')}</div>${state.detail==='Memória'?memory():state.detail==='Histórico'?historyView():state.detail==='Skills'?`<div class="memory-list">${['Coleta','Validação','Navegação'].map(x=>`<div class="panel memory-row">▧ ${x}<span style="margin-left:auto" class="faint small">Local</span></div>`).join('')}</div>`:boxes()}</section>`}
function memory(){return `<div class="detail-grid"><div><div class="row spread" style="margin-bottom:20px"><h2>AI memory</h2><span class="faint small">24 memórias</span></div><div class="memory-list">${['Priorizar fontes oficiais','Manter URL e data em cada registro','Deduplicar pelo domínio da empresa'].map((x,i)=>`<button class="panel memory-row" onclick="state.selected[${i}]=!state.selected[${i}];render()"><span class="check">${state.selected[i]?'☑':'☐'}</span><span>${x}<small>${['Preferência sua · 6 pesquisas','Padrão de coleta · 4 pesquisas','Box B2B · atualizado hoje'][i]}</small></span></button>`).join('')}</div><div class="spaced"><h2>Contextos</h2></div><div class="chips"><span class="chip">Logística no Brasil</span><span class="chip">Fornecedores</span><span class="chip">Sites oficiais</span></div><p class="faint small" style="margin-top:20px">${state.selected.filter(Boolean).length} selecionadas para a próxima execução</p></div><div class="panel resume"><h2>Retomar trabalho</h2>${stream()}<h3>Empresas de logística</h3><div class="row spread muted small"><span>Box B2B</span><span>32 / 50</span></div><div class="muted small">${state.provider}</div><button class="button primary" onclick="go('workspace')">▷ Continuar</button></div></div>`}
function historyView(){return ['Empresas de logística','Fornecedores do Sudeste','Mapeamento de distribuidores'].map((x,i)=>`<div class="panel history-item">${stream(i===1?1:0)}<div><h3>${x}</h3><p>${['Box B2B · Claude Code → Codex','Box Mercado · Codex','Box Pesquisa · Claude Code'][i]}</p><span class="faint small">${[32,86,42][i]} registros · ${[3,5,2][i]} memórias usadas</span></div><button class="button" onclick="go('workspace')">${i?'Rever':'Continuar'}</button></div>`).join('')}
function boxes(){return ['B2B','Mercado','Pesquisa'].map(n=>`<div class="panel runtime-row"><span class="icon">▣</span><div><h3>Box ${n}</h3><p>Perfil preservado</p></div><button class="button" style="margin-left:auto" onclick="go('profiles')">Abrir</button></div>`).join('')}
function settings(){return `<section class="pad"><div class="head"><h1>Clientes locais</h1><button class="button" onclick="toast('A verificação de clientes ainda não está implementada.')">↻ Verificar novamente</button></div>${['Claude Code','Codex','OpenCode','Outros CLIs'].map((n,i)=>`<div class="panel runtime-row"><span class="icon">${brand(n,36)}</span><div><h3>${n}</h3><p>${n==='Outros CLIs'?'Executável e argumentos configuráveis':'Login existente no terminal'}</p></div><span class="state">${n==='Outros CLIs'?'Adicionar':'Não verificado'}</span><button onclick="openSession()">↗</button></div>`).join('')}<div class="panel runtime-row"><h3>Pedidos de ação</h3><span class="state">Ping + som</span><button class="button" onclick="testPing()">Testar ping</button></div><div class="panel runtime-row"><h3>Motion</h3><span class="state">Reduzir movimento respeitado</span><a href="motion/racky-walkthrough.mp4" target="_blank">Ver estudo ↗</a></div></section>`}
function screenshotPage(){const file=state.page==='profiles'?'05-profiles':'07-results';return `<section><div class="cropped"><img alt="${state.page==='profiles'?'Boxes e perfis':'Resultados'}" src="screens/${file}.png"></div></section>`}
function showPeek(n){clearTimeout(peekTimer);peekTimer=setTimeout(()=>{const p=document.querySelector('#peek');p.innerHTML=`<div class="row spread"><div class="row">${avatar(n,25)}<b>${n}</b></div><span class="faint small">${n==='Shell'?'Terminal':'Ao vivo'}</span></div>${n==='Shell'?'<pre style="padding:25px 5px;color:#aaa;font-size:11px">~/Pesquisas/logistica\n$ ls\nempresas.csv  evidencias/</pre>':stream(n==='Radar'?1:0)}<p class="muted small">${n==='Radar'?'Comparando preços · Box Mercado':n==='Shell'?'Terminal avulso · sem worktree':'Validando empresas · Box B2B'}</p><footer><button onclick="state.agent='${n==='Shell'?'Atlas':n}';state.tab='${n==='Shell'?'Shell':'Agente'}';go('workspace')">Abrir sessão</button><button onclick="openAgent('${n==='Shell'?'Atlas':n}')">Ver agente ↗</button></footer>`;p.classList.add('open')},220)}
function hidePeek(){clearTimeout(peekTimer);peekTimer=setTimeout(()=>document.querySelector('#peek').classList.remove('open'),200)}
let skillsFromLaunch=false;let launch={cli:'Claude Code',location:'Pasta',attached:true};function openSession(){launch={cli:['Claude Code','Codex','OpenCode'].includes(state.provider)?state.provider:'Claude Code',location:'Pasta',attached:true};sessionDialog()}
function sessionDialog(){document.querySelector('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="dialog" role="dialog" aria-modal="true" aria-label="Nova sessão"><div class="head"><h2>Nova sessão</h2><button aria-label="Fechar" onclick="closeModal()">×</button></div><div class="chooser">${['Claude Code','Codex','OpenCode','Shell'].map((x,i)=>`<button class="${launch.cli===x?'selected':''}" onclick="launch.cli='${x}';sessionDialog()"><span class="glyph">${brand(x,32)}</span>${x}</button>`).join('')}</div><div class="formrow"><span class="muted">Local</span><div class="seg">${['Pasta','Worktree','Avulso'].map(x=>`<button class="${launch.location===x?'selected':''}" onclick="launch.location='${x}';sessionDialog()">${x}</button>`).join('')}</div></div><div class="pathbox">${launch.location==='Avulso'?'Sem projeto':launch.location==='Worktree'?'⑂ pesquisa / nova branch':'▱ ~/Pesquisas/logistica'}</div>${launch.cli==='Shell'?'':`<div class="formrow"><span class="muted">Agente</span><select aria-label="Agente para nova sessão" onchange="state.agent=this.value">${names.map(x=>`<option ${state.agent===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="formrow"><span class="muted">Skills</span><button onclick="openSkills(true)">${state.skills.join(' · ')||'Nenhuma'} ⌄</button></div>`}<div class="formrow"><label for="attachbox" class="row">${brand('Docker',24)}Anexar desktop Docker</label><input id="attachbox" type="checkbox" ${launch.attached?'checked':''} onchange="launch.attached=this.checked"></div><div class="dialog-footer"><span>${launch.cli==='Shell'?'Terminal sem agente':'Usa o login existente do CLI'}</span><button class="button primary" onclick="state.tab=launch.cli==='Shell'?'Shell':'Agente';if(launch.cli!=='Shell')state.provider=launch.cli;state.location=launch.location;state.attached=launch.attached;closeModal();go('workspace');toast('O terminal ainda não está conectado a um processo.')">Abrir sessão ↗</button></div></div></div>`}
function closeSkills(){if(skillsFromLaunch){skillsFromLaunch=false;sessionDialog()}else{closeModal();render()}}
function openSkills(fromLaunch=false){skillsFromLaunch=fromLaunch;document.querySelector('#modal').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="Skills da sessão"><div class="head"><h2>Skills da sessão</h2><button onclick="closeSkills()">×</button></div>${['Coleta','Validação','Navegação','Extração de tabelas'].map((x,i)=>`<label class="panel memory-row" style="margin-bottom:12px"><input type="checkbox" ${state.skills.includes(x)?'checked':''} onchange="if(this.checked)state.skills.push('${x}');else state.skills=state.skills.filter(s=>s!=='${x}')">${x}<span class="faint small" style="margin-left:auto">Local</span></label>`).join('')}<div class="dialog-footer"><span>Ativação conforme o CLI selecionado.</span><button class="button primary" onclick="closeSkills()">Concluir</button></div></div></div>`}
function showDesktop(){document.querySelector('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="dialog" style="width:900px"><div class="head"><h2>Box B2B</h2><button onclick="closeModal()">×</button></div><div style="height:490px">${stream()}</div><button class="button primary" onclick="closeModal();takeControl()">${state.human?'Devolver':'Assumir controle'}</button></div></div>`;document.querySelector('.dialog .stream').style.height='460px'}
function closeModal(){document.querySelector('#modal').innerHTML=''}function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3300)}
function testPing(){state.waiting=true;state.human=false;render();toast('Atlas precisa de você.');const C=window.AudioContext||window.webkitAudioContext;if(C){const c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=740;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.1,c.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.25);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.26);o.onended=()=>c.close()}}
function animateStreams(t){document.querySelectorAll('.stream').forEach((s,i)=>{const p=(reduced.matches||(s.closest('.desktop')&&(state.human||state.waiting))) ? .18 :((t/1000+i*.8)%8)/8;const rows=s.querySelectorAll('.site-row');rows.forEach((r,j)=>{r.classList.toggle('current',j===Math.floor(p*4));r.querySelector('.check').textContent=j<Math.floor(p*5)?'✓':'↗'});const cursor=s.querySelector('.cursor');if(cursor)cursor.style.transform=`translate(${s.clientWidth*(.45+.23*Math.sin(p*6.28))}px,${80+p*110}px)`});requestAnimationFrame(animateStreams)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.metaKey&&e.key==='n'){e.preventDefault();openSession()}});const initial=location.hash.slice(1);if(['overview','workspace','agents','detail','settings','profiles','results'].includes(initial))state.page=initial;render();requestAnimationFrame(animateStreams);
</script></body></html>
